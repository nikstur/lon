[package]
name = "lon"
version = "0.8.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
log = "0.4.33"
stderrlog = "0.6.0"
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking","http2","default-tls","json"] }
regex = "1.13.1"
serde_qs = "1.1.2"

[dev-dependencies]
expect-test = "1.5.1"
assert_cmd = "2.2.2"
tempfile = "3.27.0"
indoc = "2.0.7"

[build-dependencies]
sha2 = "0.11.0"

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny" }
pedantic = { level = "deny" }
unwrap_used = { level = "deny", priority = 1 }
needless_raw_string_hashes = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
